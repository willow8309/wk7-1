<style>
:root {

* { box-sizing:border-box; }
body {

}
button,input { font:inherit; }
button { cursor:pointer; }

.app {
  max-width:840px;
  margin:auto;
  padding:22px 15px 60px;
}
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:22px;
}
.logo {
  font-size:24px;
  font-weight:900;
  color:var(--primary);
}
.pill {
  background:white;
  padding:10px 15px;
  border-radius:30px;
  font-weight:800;
  font-size:13px;
}
.panel {
  background:white;
  padding:28px;
  border-radius:26px;
  box-shadow:0 12px 35px #66539912;
}
h1 { font-size:30px;margin:8px 0; }
h2 { font-size:23px;margin:10px 0 16px; }
p { line-height:1.7; }
.sub { color:var(--muted);font-size:14px; }
.center { text-align:center; }
.big { font-size:48px;margin:15px 0; }
.btn {
  background:var(--primary);
  color:white;
  border:0;
  border-radius:15px;
  padding:14px 20px;
  font-weight:800;
  min-height:48px;
}
.btn:hover:not(:disabled) { filter:brightness(.96); }
.btn.secondary {
  background:var(--purple-light);
  color:var(--primary-dark);
}
.btn.soft { background:var(--mint);color:#25694c; }
.btn.outline {
  background:white;
  color:var(--primary);
  border:2px solid #ded3ff;
}
.btn.small { padding:8px 13px;min-height:36px; }
.actions {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}
.stages {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:22px 0;
}
.stage {
  background:#f1eef7;
  color:#79738b;
  border-radius:13px;
  text-align:center;
  padding:12px 5px;
  font-size:12px;
}
.stage.active {
  background:#e1d6ff;
  color:#5032a2;
  font-weight:900;
}
.stage.done {
  background:#d7f6e6;
  color:#236947;
}
.progress {
  height:12px;
  background:#eeebf5;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}
.fill {
  height:100%;
  background:linear-gradient(90deg,#8b70e7,#67d6b4);
  transition:width .3s;
}
.question {
  background:#f8f6ff;
  border-radius:20px;
  padding:25px 16px;
  margin:22px 0;
  text-align:center;
}
.prompt {
  font-size:14px;
  font-weight:800;
  color:#7566a4;
}
.target {
  font-size:clamp(22px,5vw,34px);
  font-weight:900;
  line-height:1.55;
  margin:15px 0;
  overflow-wrap:anywhere;
}
.context {
  font-size:16px;
  line-height:1.8;
}
.answer {
  width:100%;
  padding:16px;
  border:2px solid #ddd5f2;
  border-radius:15px;
  font-size:18px;
  outline:none;
  text-align:center;
}
.answer:focus { border-color:var(--primary); }
.feedback {
  padding:17px;
  border-radius:16px;
  margin-top:16px;
  line-height:1.85;
}
.feedback.hint { background:var(--yellow); }
.feedback.good { background:var(--mint); }
.feedback.bad { background:var(--pink); }
.tiles {
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  justify-content:center;
  margin:15px 0;
  min-height:55px;
}
.tile {
  border:2px solid #e2d8ff;
  background:#f3efff;
  border-radius:12px;
  padding:11px 15px;
  font-weight:750;
}
.tile:disabled { opacity:.28; }
.slot {
  background:#f8f8fb;
  border:2px dashed #d5c9ed;
  border-radius:15px;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  padding:10px;
}
.wordgrid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:20px 0;
}
.wordcard {
  background:#f7f4ff;
  border-radius:14px;
  padding:13px 8px;
  text-align:center;
  cursor:pointer;
  border:0;
  width:100%;
}
.wordcard strong {
  display:block;
  color:#6044b4;
  font-size:15px;
}
.wordcard span {
  display:block;
  margin-top:7px;
  font-size:12px;
  color:#656174;
}
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}
.stat {
  background:#f5f2ff;
  border-radius:16px;
  padding:17px 8px;
  text-align:center;
}
.stat b {
  display:block;
  color:var(--primary);
  font-size:25px;
}
.stat span { color:var(--muted);font-size:12px; }
.reviewitem {
  padding:13px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
.notice {
  background:#f7f4ff;
  padding:14px;
  border-radius:14px;
  font-size:13px;
  line-height:1.8;
}
footer {
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#8c8799;
}
@media(max-width:600px) {
  .panel { padding:18px; }
  .wordgrid { grid-template-columns:repeat(2,1fr); }
  .stages { gap:4px; }
  .stage { font-size:10px;padding:10px 2px; }
  .logo { font-size:19px; }
}
</style>
</head>

  },
  {
    name:"문맥 빈칸",
    icon:"🌿",
    desc:"영어 문장의 빈칸 완성"
  },
  {
    name:"어순 배열",
    icon:"🌻",
    desc:"영어 단어 카드를 올바르게 배열"
  },
  {
    name:"문장 영작",
    icon:"🏆",
    desc:"한국어 문장을 보고 영어로 영작"
  }
];

const STORAGE_KEY="wordquest_middle1_updated_v2";

function freshState(){
  return {
    level:0,
    index:0,
    xp:0,
    completed:[],
    mistakes:{},
    mastered:{},
    streak:0
  };
}

function loadState(){
  try {
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(
      saved &&
      typeof saved.level==="number" &&
      saved.level>=0 &&
      saved.level<=5 &&
      typeof saved.index==="number" &&
      saved.index>=0 &&
      saved.index<20 &&
      saved.mistakes &&
      saved.mastered &&
      Array.isArray(saved.completed)
    ){
      return saved;
    }
  }catch(e){}
  return freshState();
}

let state=loadState();
let current=null;
let attempt=0;
let selected=[];
let activeTiles=[];
let showingAnswer=false;
let reviewMode=false;
let reviewQueue=[];
let reviewIndex=0;
let hadError=false;

function $(id){
  return document.getElementById(id);
}

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){}
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function normalizeEnglish(text){
  return String(text)
    .toLowerCase()
    .replace(/[.,!?'"’]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function normalizeKorean(text){
  return String(text)
    .replace(/[\s.,!?()·]/g,"")
    .trim();
}

function shuffle(items){
  const result=[...items];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}

function speak(text){
  if(!("speechSynthesis" in window)){
    alert("이 브라우저에서는 음성 재생을 지원하지 않아요.");
    return;
  }
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="en-US";
  utterance.rate=.82;
  speechSynthesis.speak(utterance);
}

function updateHeader(){
  $("headerScore").textContent="⭐ "+state.xp+" XP";
}

function stageHTML(level){
  return `
  <div class="stages">
    ${LEVELS.map((stage,i)=>`
      <div class="stage ${
        i===level?"active":i<level?"done":""
      }">
        ${stage.icon}<br>${i+1}단계
      </div>
    `).join("")}
  </div>`;
}

function wordCards(){
  return `
  <div class="wordgrid">
    ${WORDS.map((word,i)=>`
      <button class="wordcard" onclick="speak(WORDS[${i}].w)">
        <strong>${escapeHTML(word.w)} 🔊</strong>
        <span>${escapeHTML(word.k)}</span>
      </button>
    `).join("")}
  </div>`;
}

function home(){
  reviewMode=false;
  current=null;
  updateHeader();

  const finished=state.level>=5;

  $("screen").innerHTML=`
  <section class="panel">
    <div class="center">
      <div class="big">🚀</div>
      <h1>20 Words, 5 Levels!</h1>
      <p class="sub">중학교 1학년 영어 어휘 챌린지</p>
      <p>
        단어의 뜻을 이해하고,<br>
        문장 속에서 사용하고,<br>
        마지막에는 직접 영작해 보세요!
      </p>
    </div>

    ${stageHTML(Math.min(state.level,4))}

    <div class="stats">
      <div class="stat">
        <b>${state.xp}</b>
        <span>획득 XP</span>
      </div>
      <div class="stat">
        <b>${state.completed.length}</b>
        <span>완료 단계</span>
      </div>
      <div class="stat">
        <b>${Object.keys(state.mistakes).length}</b>
        <span>복습 단어</span>
      </div>
    </div>

    <div class="notice">
      💡 틀려도 괜찮아요!<br>
      정답을 바로 알려주지 않고 힌트를 제공해요.
      단서를 활용해 다시 도전해 보세요.
    </div>

    <div class="actions">
      <button class="btn" onclick="start()">
        ${
          finished?"🏆 최종 결과 보기":
          state.index>0?"▶ 이어서 학습하기":
          "▶ 학습 시작"
        }
      </button>
      <button class="btn secondary" onclick="showWords()">
        📚 단어 미리보기
      </button>
      <button class="btn soft" onclick="startReview()">
        🔁 오답 복습
      </button>
    </div>

    <p class="sub center">
      학습 진도는 현재 브라우저에 자동 저장됩니다.
    </p>
  </section>`;
}

function showWords(){
  $("screen").innerHTML=`
  <section class="panel">
    <h2>📚 오늘의 핵심 단어 20개</h2>
    <p class="sub">
      단어를 누르면 영어 발음을 들을 수 있어요.
    </p>
    ${wordCards()}
    <div class="actions">
      <button class="btn" onclick="home()">돌아가기</button>
    </div>
  </section>`;
}

function start(){
  if(state.level>=5){
    finalResult();
    return;
  }
  reviewMode=false;
  showQuestion();
}

function getWord(){
  return reviewMode
    ? WORDS[reviewQueue[reviewIndex].index]
    : WORDS[state.index];
}

function getLevel(){
  return reviewMode
    ? reviewQueue[reviewIndex].level
    : state.level;
}

function showQuestion(){
  attempt=0;
  selected=[];
  activeTiles=[];
  showingAnswer=false;
  hadError=false;
  renderQuestion();
}

function blankSentence(word){
  const escaped=word.w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return word.sentence.replace(
    new RegExp("\\b"+escaped+"\\b","i"),
    "________"
  );
}

function renderQuestion(){
  const word=getWord();
  const level=getLevel();
  current=word;
  updateHeader();

  const number=reviewMode?reviewIndex+1:state.index+1;
  const total=reviewMode?reviewQueue.length:20;
  const percent=(number-1)/total*100;

  let prompt="";
  let target="";
  let extra="";

  if(level===0){
    prompt="한국어 뜻을 영어 단어로!";
    target=word.k;
  }

  if(level===1){
    prompt="영어 단어의 뜻을 입력하세요.";
    target=word.w;
  }

  if(level===2){
    prompt="문맥에 맞는 영어 단어를 입력하세요.";
    target=blankSentence(word);
    extra=`
      <p class="sub">${escapeHTML(word.ko)}</p>
    `;
  }

  if(level===3){
    prompt="단어를 올바른 순서로 배열하세요.";
    target=word.ko;
  }

  if(level===4){
    prompt="한국어 문장을 영어로 쓰세요.";
    target=word.ko;
  }

  let task="";

  if(level===3){
    const tokens=word.sentence.split(/\s+/);
    activeTiles=shuffle(tokens.map((text,index)=>({
      text,index
    })));

    task=`
      <div class="slot" id="slot">
        <span class="sub">여기에 문장을 배열하세요.</span>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="actions">
        <button class="btn secondary" onclick="undoTile()">
          ↩ 한 단어 취소
        </button>
        <button class="btn outline" onclick="clearTiles()">
          다시 배열
        </button>
      </div>
    `;
  }else{
    task=`
      <input
        id="answer"
        class="answer"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="${
          level===1?"한국어 뜻 입력":"영어로 입력"
        }"
        onkeydown="if(event.key==='Enter')checkAnswer()"
      >
    `;
  }

  $("screen").innerHTML=`
  <section class="panel">
    <div class="sub">
      ${
        reviewMode?"🔁 오답 복습":
        "LEVEL "+(level+1)+" · "+LEVELS[level].name
      }
    </div>

    ${stageHTML(level)}

    <div style="display:flex;justify-content:space-between">
      <strong>${number} / ${total}</strong>
      <span class="sub" id="attemptLabel">시도 0/3</span>
    </div>

    <div class="progress">
      <div class="fill" style="width:${percent}%"></div>
    </div>

    <div class="question">
      <div class="prompt">${prompt}</div>
      <div class="target">${escapeHTML(target)}</div>
      ${extra}

      ${
        level===1||level===2
        ? `<button class="btn small secondary"
             onclick="speak(${
               level===1?"current.w":"current.sentence"
             })">🔊 듣기</button>`
        : ""
      }
    </div>

    ${task}

    <div id="feedbackArea" aria-live="polite"></div>

    <div class="actions" id="submitArea">
      <button class="btn" onclick="checkAnswer()">
        정답 확인 →
      </button>
    </div>

    <div class="actions">
      <button class="btn small outline" onclick="home()">
        🏠 홈
      </button>
    </div>
  </section>`;

  if(level===3){
    renderTiles();
  }else{
    $("answer").focus();
  }
}

function renderTiles(){
  const tiles=$("tiles");
  const slot=$("slot");

  if(!tiles||!slot)return;

  tiles.innerHTML=activeTiles.map((tile,i)=>`
    <button
      class="tile"
      ${selected.includes(i)?"disabled":""}
      onclick="addTile(${i})"
    >${escapeHTML(tile.text)}</button>
  `).join("");

  slot.innerHTML=selected.length
    ? selected.map((id,pos)=>`
        <button class="tile" onclick="removeTile(${pos})">
          ${escapeHTML(activeTiles[id].text)}
        </button>
      `).join("")
    : `<span class="sub">
         단어를 순서대로 눌러 보세요.
       </span>`;
}

function addTile(index){
  if(showingAnswer||selected.includes(index))return;
  selected.push(index);
  renderTiles();
}

function removeTile(position){
  if(showingAnswer)return;
  selected.splice(position,1);
  renderTiles();
}

function undoTile(){
  if(showingAnswer)return;
  selected.pop();
  renderTiles();
}

function clearTiles(){
  if(showingAnswer)return;
  selected=[];
  renderTiles();
}

function userAnswer(){
  if(getLevel()===3){
    return selected.map(i=>activeTiles[i].text).join(" ");
  }
  return $("answer")?.value||"";
}

function isCorrect(value,word,level){
  if(level===1){
    return word.aliases.some(
      alias=>normalizeKorean(value)===normalizeKorean(alias)
    );
  }

  const expected=level===0||level===2
    ? word.w
    : word.sentence;

  return normalizeEnglish(value)===normalizeEnglish(expected);
}

function showFeedback(type,message){
  const area=$("feedbackArea");
  if(!area)return;

  area.innerHTML=`
    <div class="feedback ${type}">
      ${message}
    </div>
  `;
}

function hintFor(word,level,number){
  if(level===0||level===2){
    return [word.h1,word.h2,word.h3][number-1];
  }

  if(level===1){
    if(number===1){
      return "예문을 살펴보세요: "+word.sentence;
    }
    if(number===2){
      return word.h1;
    }
    return "뜻을 구별해 보세요. "+word.h2;
  }

  const tokens=word.sentence.split(" ");

  if(level===3){
    if(number===1){
      return "영어 평서문은 보통 주어 + 동사 순서로 시작해요.";
    }
    if(number===2){
      return "첫 단어는 '"+tokens[0]+"'예요.";
    }
    return "처음 두 단어는 '"+
      tokens.slice(0,2).join(" ")+"'예요.";
  }

  if(level===4){
    if(number===1){
      return "먼저 주어와 동사를 찾아보세요.";
    }
    if(number===2){
      return "첫 부분은 '"+
        tokens.slice(0,2).join(" ")+"'예요.";
    }
    return "문장 구조: "+
      tokens.map((token,i)=>
        i<3?token:token.replace(/[A-Za-z]/g,"_")
      ).join(" ");
  }

  return "";
}

function checkAnswer(){
  if(showingAnswer)return;

  const word=getWord();
  const level=getLevel();
  const value=userAnswer().trim();

  if(!value){
    showFeedback(
      "hint",
      "✏️ 먼저 답을 입력하거나 단어를 배열해 보세요."
    );
    return;
  }

  if(isCorrect(value,word,level)){
    success();
    return;
  }

  attempt++;
  hadError=true;
  state.streak=0;
  state.mistakes[word.w]=(state.mistakes[word.w]||0)+1;
  saveState();

  $("attemptLabel").textContent="시도 "+attempt+"/3";

  if(attempt<3){
    showFeedback(
      "hint",
      `<strong>💡 다시 생각해 볼까요? (${attempt}/3)</strong>
       <p>${escapeHTML(hintFor(word,level,attempt))}</p>
       정답은 아직 공개하지 않을게요.
       단서를 보고 다시 도전하세요!`
    );

    if(level!==3&&$("answer")){
      $("answer").focus();
    }
  }else{
    showFeedback(
      "bad",
      `<strong>🌷 세 번 도전했어요!</strong>
       <p>${escapeHTML(hintFor(word,level,3))}</p>
       마지막 단서를 확인하고 정답을 살펴보세요.`
    );

    $("submitArea").innerHTML=`
      <button class="btn" onclick="revealAnswer()">
        정답과 해설 확인
      </button>
    `;
  }
}

function success(){
  const word=getWord();

  const earned=attempt===0?15:attempt===1?10:7;

  state.xp+=earned;
  state.streak++;
  state.mastered[word.w]=(state.mastered[word.w]||0)+1;

  saveState();
  showingAnswer=true;

  showFeedback(
    "good",
    `<strong>🎉 정답이에요! +${earned} XP</strong>
     <p>${escapeHTML(word.note)}</p>
     <strong>${escapeHTML(word.sentence)}</strong>
     <p>${escapeHTML(word.ko)}</p>`
  );

  $("submitArea").innerHTML=`
    <button class="btn secondary"
      onclick="speak(current.sentence)">
      🔊 문장 듣기
    </button>
    <button class="btn" onclick="nextQuestion()">
      다음 문제 →
    </button>
  `;

  if($("answer"))$("answer").disabled=true;
  if(getLevel()===3)renderTiles();
}

function revealAnswer(){
  const word=getWord();
  const level=getLevel();

  const correct=level===1
    ? word.k
    : level===0||level===2
      ? word.w
      : word.sentence;

  showingAnswer=true;

  showFeedback(
    "bad",
    `<strong>📖 정답: ${escapeHTML(correct)}</strong>
     <p>${escapeHTML(word.note)}</p>
     <strong>예문:</strong> ${escapeHTML(word.sentence)}
     <p><strong>해석:</strong> ${escapeHTML(word.ko)}</p>`
  );

  $("submitArea").innerHTML=`
    <button class="btn secondary"
      onclick="speak(current.sentence)">
      🔊 문장 듣기
    </button>
    <button class="btn" onclick="nextQuestion()">
      다음 문제 →
    </button>
  `;

  if($("answer"))$("answer").disabled=true;
}

function nextQuestion(){
  if(reviewMode){
    reviewIndex++;

    if(reviewIndex>=reviewQueue.length){
      reviewFinished();
    }else{
      showQuestion();
    }
    return;
  }

  state.index++;

  if(state.index>=20){
    state.completed.push(state.level);
    state.level++;
    state.index=0;
    saveState();

    if(state.level>=5){
      finalResult();
    }else{
      levelFinished();
    }
  }else{
    saveState();
    showQuestion();
  }
}

function levelFinished(){
  const previous=state.level-1;

  $("screen").innerHTML=`
  <section class="panel center">
    <div class="big">🎊</div>
    <h1>${previous+1}단계 완료!</h1>
    <p>${LEVELS[previous].desc} 미션을 마쳤어요.</p>
    <p>
      다음 단계에서는 조금 더 어려운 활동에
      도전해 보세요.
    </p>

    ${stageHTML(state.level)}

    <div class="actions">
      <button class="btn" onclick="start()">
        다음 단계 시작 →
      </button>
      <button class="btn secondary" onclick="home()">
        홈으로
      </button>
    </div>
  </section>`;
}

function startReview(){
  const ids=Object.keys(state.mistakes);

  if(!ids.length){
    $("screen").innerHTML=`
    <section class="panel center">
      <h2>🌟 아직 복습할 오답이 없어요!</h2>
      <p>학습을 시작하면 틀린 단어가 이곳에 모여요.</p>
      <button class="btn" onclick="home()">홈으로</button>
    </section>`;
    return;
  }

  reviewMode=true;
  reviewQueue=[];

  ids.forEach(id=>{
    const index=WORDS.findIndex(word=>word.w===id);
    if(index<0)return;

    const highest=Math.min(state.level,4);

    reviewQueue.push({
      index,
      level:Math.max(0,highest)
    });
  });

  reviewQueue=shuffle(reviewQueue);
  reviewIndex=0;
  showQuestion();
}

function reviewFinished(){
  $("screen").innerHTML=`
  <section class="panel center">
    <div class="big">💪</div>
    <h2>복습 완료!</h2>
    <p>어려웠던 단어를 다시 연습했어요.</p>
    <p class="sub">
      오답 기록은 계속 보관되므로
      반복해서 복습할 수 있어요.
    </p>
    <div class="actions">
      <button class="btn" onclick="home()">홈으로</button>
    </div>
  </section>`;
}

function finalResult(){
  updateHeader();

  const mistakes=Object.entries(state.mistakes)
    .sort((a,b)=>b[1]-a[1]);

  $("screen").innerHTML=`
  <section class="panel center">
    <div class="big">🏆</div>
    <h1>Word Quest Complete!</h1>
    <p>5단계, 100문제 학습을 모두 마쳤어요!</p>

    <div class="stats">
      <div class="stat">
        <b>${state.xp}</b>
        <span>총 XP</span>
      </div>
      <div class="stat">
        <b>100</b>
        <span>완료 문제</span>
      </div>
      <div class="stat">
        <b>${mistakes.length}</b>
        <span>복습 단어</span>
      </div>
    </div>

    <h2>📋 나의 복습 목록</h2>

    ${
      mistakes.length
      ? mistakes.map(([id,count])=>{
          const word=WORDS.find(w=>w.w===id);
          return `
          <div class="reviewitem">
            <strong>${escapeHTML(id)}</strong>
            · ${escapeHTML(word?.k||"")}
            · 오답 ${count}회
          </div>`;
        }).join("")
      : "<p>아직 기록된 오답이 없어요.</p>"
    }

    <div class="actions">
      <button class="btn" onclick="startReview()">
        🔁 오답 다시 풀기
      </button>
      <button class="btn secondary" onclick="home()">
        홈으로
      </button>
      <button class="btn outline" onclick="exportResults()">
        📄 결과 저장
      </button>
    </div>

    <div class="actions">
      <button class="btn small outline"
        onclick="resetProgress()">
        학습 처음부터 다시 하기
      </button>
    </div>
  </section>`;
}

function exportResults(){
  const lines=[
    "Word Quest 학습 결과",
    "획득 XP: "+state.xp,
    "완료 단계: "+state.completed.length,
    "",
    "단어,뜻,오답 횟수,정답 횟수"
  ];

  WORDS.forEach(word=>{
    const values=[
      word.w,
      word.k,
      state.mistakes[word.w]||0,
      state.mastered[word.w]||0
    ];

    lines.push(values.map(value=>
      '"'+String(value).replace(/"/g,'""')+'"'
    ).join(","));
  });

  const blob=new Blob(
    ["\uFEFF"+lines.join("\n")],
    {type:"text/csv;charset=utf-8"}
  );

  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=url;
  link.download="wordquest_results.csv";
  link.click();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function resetProgress(){
  if(!confirm("모든 학습 진도를 초기화할까요?"))return;

  state=freshState();
  saveState();
  home();
}

home();
</script>
</body>
</html>
